name: govpulse
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.0.0
  http: ^1.2.0
  connectivity_plus: ^6.0.3
  internet_connection_checker: ^1.0.0+1
  flutter_local_notifications: ^17.0.0
  shared_preferences: ^2.5.5
  dotted_border: ^2.0.0
  camera: ^0.10.5+9
  google_mlkit_face_detection: ^0.11.0
  image: ^4.1.7
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1
  android_intent_plus: ^4.0.0
  image_picker: ^1.1.2
  video_thumbnail: ^0.5.3
  video_player: ^2.9.2
  google_maps_flutter: ^2.9.0
  flutter_map: ^8.1.0
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  geolocator_android: ^4.3.0 
  geocoding: ^3.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.19.0
  google_mlkit_text_recognition: ^0.13.0
  path_provider: ^2.1.4
  cached_network_image: ^3.3.1
  sqflite: ^2.3.0
  share_plus: ^10.1.4
  flutter_riverpod: ^2.5.1
  firebase_messaging: ^15.1.0 
  supabase: ^2.12.2
  flutter_facebook_auth: ^7.0.0
  fl_chart: ^1.2.0
  pdf: ^3.11.3
  printing: ^5.13.4
  # Already resolved transitively via `pdf`; declared directly because the
  # endorsement QR is drawn from it on screen (core/widgets/qr_view.dart) as
  # well as inside the PDF, and a direct import of a transitive dependency
  # breaks the moment `pdf` drops it.
  barcode: ^2.2.9
  go_router: ^17.4.0
  # Already resolved transitively; declared directly because the emergency
  # screen dials `tel:` on web through a synthesised anchor click rather than
  # url_launcher's `window.open`, which Safari's popup blocker eats.
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  # Test-only. `image_picker` does NOT re-export ImagePickerPlatform, so a test
  # that needs to stand in for the gallery — attaching a real file so the
  # submit guards can be driven end to end — has to reach the interface
  # directly. Declared rather than relied on transitively for the same reason
  # `barcode` is declared above: it breaks the moment image_picker drops it.
  image_picker_platform_interface: ^2.11.1
  # Test-only, and declared for the same reason as the interface above: it
  # arrives transitively through flutter_test today, so relying on that would
  # break silently if that ever changes. Used to drive the splash loader's
  # grace-period timer without sleeping in real time.
  fake_async: ^1.3.1
   

flutter:
  uses-material-design: true
  assets:
    
    - assets/images/report/
    - assets/images/suggestion/
    - assets/images/emergency/
    - assets/images/settings/
    - assets/images/idicons/
    - assets/images/idcards/
    - assets/images/verification/
    - assets/images/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/applogo.png"